<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contractor Sign In - HVAC AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
        }

        .login-card h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .login-card p {
            color: var(--text-gray);
            margin-bottom: 1.5rem;
        }

        .login-card label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 0.35rem;
        }

        .login-card input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: var(--card-bg);
            color: var(--text-light);
            font: inherit;
        }

        .login-card button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary-orange), var(--accent-orange));
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .login-card button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .login-error {
            color: var(--error);
            font-size: 0.9rem;
            min-height: 1.2em;
            margin-bottom: 0.75rem;
        }
    </style>
</head>

<body>
    <div class="login-wrap">
        <form class="login-card" id="loginForm">
            <h1>🔧 Contractor Portal</h1>
            <p>Sign in to review cases and approve quotes.</p>

            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <div class="login-error" id="loginError" role="alert"></div>
            <button type="submit" id="loginBtn">Sign in</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');
        const button = document.getElementById('loginBtn');

        // Already signed in? Go straight to the portal.
        fetch('/api/auth/me').then(r => { if (r.ok) window.location.replace('/contractor'); });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorEl.textContent = '';
            button.disabled = true;
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: form.username.value.trim(),
                        password: form.password.value
                    })
                });
                if (response.ok) {
                    window.location.replace('/contractor');
                    return;
                }
                const data = await response.json().catch(() => ({}));
                errorEl.textContent = data.error || 'Sign in failed';
            } catch (error) {
                errorEl.textContent = 'Could not reach the server';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>

</html>
